<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Oli Vibes AI Music</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 40px 20px;
            color: #000000;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            margin-bottom: 40px;
            color: #444444;
        }

        .song-card {
            background: #f2f2f2;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.15);
        }

        .song-title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        button, a.download-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        button.play-btn {
            background: #3366ff;
            color: white;
        }

        a.download-btn {
            background: #00e6a8;
            color: #000000;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h1>Oli Vibes</h1>
<p class="subtitle">AI Generated Music Downloads</p>

<div id="song-list">Loading songs...</div>

<script>
fetch("songs.json")
  .then(response => response.json())
  .then(songs => {
    const container = document.getElementById("song-list");
    container.innerHTML = "";

    songs.forEach((song, index) => {
      const card = document.createElement("div");
      card.className = "song-card";

      card.innerHTML = `
          <div class="song-title">${song.title}</div>
          <div class="buttons">
             <button class="play-btn" onclick="togglePlay(${index})">Play</button>
             <a class="download-btn" href="${song.url}" download>Download</a>
          </div>
          <audio id="audio-${index}" src="${song.url}"></audio>
      `;

      container.appendChild(card);
    });
  });

function togglePlay(i) {
  const audio = document.getElementById("audio-" + i);

  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}
</script>

</body>
</html>
